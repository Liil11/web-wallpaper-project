<html lang="en">

                    </g>
                </svg>
            </button>
        </header>

        <section id="messages" class="chat-messages" aria-live="polite">
            <div id="welcome" class="welcome-screen">
                <div class="welcome-avatar">S</div>
                <h2 class="welcome-title">Master!</h2>
                <p class="welcome-subtitle">system online at 100%, what should we do now, Master?</p>
                <div class="suggestion-chips">
                    <button class="suggestion-chip" type="button" data-text="/tictactoe">tictactoe</button>
                    <button class="suggestion-chip" type="button" data-text="/wordle">wordle</button>
                    <button class="suggestion-chip" type="button" data-text="/sudoku">sudoku</button>
                    <button class="suggestion-chip" type="button" data-text="/help">option</button>
                </div>
            </div>
            <div class="popup" id="popup">
                <button class="suggestion-chip" type="button" data-text="/tictactoe">tictactoe</button>
                <button class="suggestion-chip" type="button" data-text="/wordle">wordle</button>
                <button class="suggestion-chip" type="button" data-text="/sudoku">sudoku</button>
                <button class="suggestion-chip" type="button" data-text="/help">option</button>
            </div>
            <div id="typing" class="typing-indicator" aria-hidden="true">
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
        </section>
        <footer class="chat-input-area">
           <!-- /* antara taro diatas input area atau di message paling bawah buat POPUP */-->
            <form id="composer" class="input-wrapper" autocomplete="off">
                <button id="option-btn" class="option-button blimp" aria-label="option">
                    <svg class="svg" viewBox="0 0 24 24" width="24" height="24" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <textarea
                    id="input"
                    class="input-field"
                    placeholder="Type a message…"
                    rows="1"
                    aria-label="Message"></textarea>
                <button id="send" class="send-btn blimp" type="submit" aria-label="Send">
                    <svg class="svg" width="20" height="20" viewbox="0 0 40 40" >
                        <path
                        d="M39.72 0.85
                        C39.88 -0.05 38.92 -0.57 38.15 -0.12
                        L1.15 21.55
                        C-0.55 22.55 -0.32 25.02 1.52 25.7

                        L10.05 38.22
                        C10.05 40.3 12.7 41.15 14 39.5
                        L19.45 32.62
                        L29.85 36.92
                        C31.48 37.6 33.25 36.58 33.55 34.82
                        L39.72 0.85Z

                        M13.05 27.85
                        L33.65 8.15
                        L17.2 29.25
                        L13.05 34.45
                        V27.85Z"

                        />
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <script type="module" src="scripts/script.js" defer></script>
    <script>
    </script>
</body>
</html>
